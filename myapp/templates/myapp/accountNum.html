<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <title>Account Number</title>
    <style>
        body {
            background-color: #2C2C2C; /* Dark background */
            color: #f1f1f1; /* Light text for contrast */
            font-family: 'Arial', sans-serif;
        }
        .container {
            margin-top: 80px;
        }
        h4 {
            color: #f1f1f1;
        }
        .form-control {
            background-color: #333;
            color: #fff;
            border: none;
            border-radius: 8px;
        }
        .form-control:disabled {
            background-color: #444;
        }
        .btn-success {
            background-color: #4CAF50;
            border-color: #4CAF50;
            transition: transform 0.3s;
        }
        .btn-success:hover {
            background-color: #45A049;
            transform: scale(1.05);
        }
        .btn-success:active {
            background-color: #3E8E41;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="col-md-6 offset-md-3 mt-5">
                {%csrf_token%}
                <h4 class="text-center">Your account has been successfully created! Please keep your account number and password safe for future transactions.</h4>
                <input type="text" class="form-control mt-4" value="{{customer.account.account_number}}" disabled>
                <a href="/main/{{customer.customer_id}}"><div class="btn btn-success mt-5 text-center">Go to Main Page</div></a>
            </div>
        </div>
    </div>
</body>
</html>
